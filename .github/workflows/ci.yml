name: CI Build & Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and assemble Android APK
        working-directory: android-app
        run: gradle test assembleDebug --no-daemon

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FeericLightStudio.exe
        shell: powershell
        run: |
          $fx = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          $winmdDir = "C:\Windows\System32\WinMetadata"
          & "$fx\csc.exe" /nologo /target:winexe /out:FeericLightStudio.exe `
            /r:"$fx\System.Windows.Forms.dll" `
            /r:"$fx\System.Drawing.dll" `
            /r:"$fx\System.Runtime.WindowsRuntime.dll" `
            /r:"$fx\System.Runtime.dll" `
            /r:"$fx\System.Runtime.InteropServices.WindowsRuntime.dll" `
            /r:"$fx\System.Numerics.dll" `
            /r:"$winmdDir\Windows.Devices.winmd" `
            /r:"$winmdDir\Windows.Foundation.winmd" `
            /r:"$winmdDir\Windows.Storage.winmd" `
            "windows-app\FeericLightStudio.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
