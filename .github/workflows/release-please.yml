name: Release Please & Build Binaries

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-android:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests & build APKs
        working-directory: android-app
        run: gradle test assembleDebug assembleRelease --no-daemon

      - name: Prepare APK release assets
        run: |
          VER="${{ needs.release-please.outputs.version }}"
          cp android-app/app/build/outputs/apk/release/app-release.apk "feericlight-modern-v${VER}.apk"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "feericlight-modern-debug-v${VER}.apk"

      - name: Upload Android APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.release-please.outputs.version }}"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "feericlight-modern-v${VER}.apk" \
            "feericlight-modern-debug-v${VER}.apk" \
            --clobber

  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Compile FeericLightStudio.exe
        shell: powershell
        run: |
          $ver = "${{ needs.release-please.outputs.version }}"
          $outExe = "FeericLightStudio-v$ver.exe"
          $fx = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          $winmdDir = "C:\Windows\System32\WinMetadata"
          if (-not (Test-Path "$winmdDir\Windows.Devices.winmd")) {
            throw "WinMetadata (.winmd) not found in $winmdDir"
          }
          & "$fx\csc.exe" /nologo /target:winexe /out:$outExe `
            /r:"$fx\System.Windows.Forms.dll" `
            /r:"$fx\System.Drawing.dll" `
            /r:"$fx\System.Runtime.WindowsRuntime.dll" `
            /r:"$fx\System.Runtime.dll" `
            /r:"$fx\System.Runtime.InteropServices.WindowsRuntime.dll" `
            /r:"$fx\System.Numerics.dll" `
            /r:"$winmdDir\Windows.Devices.winmd" `
            /r:"$winmdDir\Windows.Foundation.winmd" `
            /r:"$winmdDir\Windows.Storage.winmd" `
            "windows-app\FeericLightStudio.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows EXE to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $ver = "${{ needs.release-please.outputs.version }}"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "FeericLightStudio-v$ver.exe" --clobber
